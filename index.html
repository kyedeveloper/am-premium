<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AM Premium Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        :root { --accent: #9d50bb; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 420px; background: rgba(20, 20, 25, 0.9); backdrop-filter: blur(20px); border: 1px solid #333; border-radius: 35px; padding: 30px; box-shadow: 0 10px 50px rgba(0,0,0,0.5); }
        .tab-btn { flex: 1; padding: 12px; border-radius: 15px; border:none; background:#111; color:#777; font-weight:600; cursor:pointer; }
        .tab-btn.active { background: linear-gradient(135deg, #6e48aa, #9d50bb); color: white; }
        input { width: 100%; padding: 16px; border-radius: 15px; background: #000; border: 1px solid #333; color: white; margin-bottom: 12px; box-sizing: border-box; }
        .btn { width: 100%; padding: 16px; border-radius: 15px; border: none; background: #fff; color: #000; font-weight: 700; cursor: pointer; margin-top: 5px; }
        .song-card { background: #111; padding: 12px; border-radius: 15px; margin-bottom: 10px; display: flex; align-items: center; border: 1px solid #222; }
        .history-item { padding: 12px; border-bottom: 1px solid #111; font-size: 12px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="card">
        <div id="clock" style="text-align:center; color:#555; font-size:11px; margin-bottom:20px;">--:--:--</div>
        
        <div style="display:flex; gap:10px; margin-bottom:25px;">
            <button class="tab-btn active" onclick="switchTab('proc')">Premium</button>
            <button class="tab-btn" onclick="switchTab('music')">Music</button>
        </div>

        <div id="proc-tab">
            <input id="email" placeholder="Email Alight Motion">
            <button class="btn" onclick="sendEmail()">Kirim Verifikasi</button>
            <input id="magicLink" placeholder="Paste Magic Link">
            <button class="btn" onclick="verifyAcc()">Aktifkan Premium</button>
            <div id="historyList" style="margin-top:25px;">
                <div style="text-align:center; color:#444; font-size:12px;">Memuat data...</div>
            </div>
        </div>

        <div id="music-tab" style="display:none;">
            <input id="q" placeholder="Cari lagu populer...">
            <button class="btn" onclick="searchMusic()">Search Music</button>
            <div id="results" style="margin-top:15px;"></div>
            <div id="player-box" style="display:none; margin-top:20px; background:#111; padding:15px; border-radius:20px;">
                <audio id="audio" controls style="width:100%;"></audio>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>
</html>
