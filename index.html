<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Premium | Elite Processor</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- SweetAlert Dark Theme -->
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@5/dark.css" rel="stylesheet">
    
    <style>
        /* =========================================
           GLOBAL VARIABLES & RESET
           ========================================= */
        :root {
            --bg-color: #030305;
            --surface: rgba(20, 20, 25, 0.4);
            --surface-hover: rgba(30, 30, 38, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.2);
            --primary: #9d50bb;
            --secondary: #6e48aa;
            --text-main: #ffffff;
            --text-muted: #888899;
            --success: #00d2ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* =========================================
           ANIMATED BACKGROUND (MESH GRADIENT)
           ========================================= */
        .ambient-bg {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #000;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: float 10s infinite alternate ease-in-out;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--secondary); top: -100px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; background: #00d2ff; bottom: -50px; right: -50px; animation-delay: -3s; }
        .orb-3 { width: 250px; height: 250px; background: var(--primary); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-duration: 15s; opacity: 0.3; }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        /* =========================================
           MAIN CONTAINER (GLASSMORPHISM)
           ========================================= */
        .glass-panel {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* =========================================
           HEADER & CLOCK
           ========================================= */
        .header { text-align: center; margin-bottom: 30px; }
        .clock { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 3px; margin-bottom: 15px; text-transform: uppercase; }
        .title { font-size: 26px; font-weight: 800; background: linear-gradient(to right, #fff, #a0a0a0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .subtitle { font-size: 13px; color: var(--text-muted); }

        /* =========================================
           TABS NAVIGATION
           ========================================= */
        .nav-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 6px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        .tab-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* =========================================
           INPUTS & BUTTONS
           ========================================= */
        .input-group { margin-bottom: 20px; position: relative; }
        input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 18px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        input::placeholder { color: #555; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(157, 80, 187, 0.2); background: rgba(0, 0, 0, 0.7); }

        .btn-glow {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-glow::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(157, 80, 187, 0.4); }
        .btn-glow:hover::before { left: 100%; }

        /* =========================================
           LIVE FEED (DATABASE)
           ========================================= */
        .feed-section { margin-top: 35px; }
        .feed-header {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 12px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;
            border-bottom: 1px solid var(--border); padding-bottom: 10px;
        }
        .pulse-dot {
            width: 8px; height: 8px; background: var(--success); border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
        
        .feed-list {
            max-height: 140px; overflow-y: auto; padding-right: 5px;
        }
        /* Custom Scrollbar */
        .feed-list::-webkit-scrollbar { width: 4px; }
        .feed-list::-webkit-scrollbar-thumb { background: var(--border-highlight); border-radius: 10px; }
        
        .feed-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; background: rgba(0,0,0,0.3); border-radius: 12px;
            margin-bottom: 8px; border: 1px solid transparent;
            transition: 0.3s;
        }
        .feed-item:hover { border-color: var(--border-highlight); background: rgba(255,255,255,0.05); }
        .feed-email { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .feed-time { font-size: 11px; color: #666; }

        /* =========================================
           MAINTENANCE TAB (MUSIC)
           ========================================= */
        .maintenance-card {
            text-align: center;
            padding: 40px 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 24px;
            border: 1px dashed var(--border-highlight);
        }
        .maintenance-icon { font-size: 40px; margin-bottom: 15px; animation: float 3s infinite ease-in-out; }
        .maintenance-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .maintenance-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

        /* =========================================
           FLOATING MUSIC CONTROLLER
           ========================================= */
        .music-widget {
            position: fixed; bottom: 30px; right: 30px;
            width: 50px; height: 50px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border: 1px solid var(--border-highlight); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 100; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .music-widget:hover { transform: scale(1.1); background: rgba(255,255,255,0.2); }
        .music-widget.playing { border-color: var(--primary); box-shadow: 0 0 20px rgba(157, 80, 187, 0.4); }
        .music-bar { width: 3px; height: 10px; background: #fff; margin: 0 2px; border-radius: 2px; transition: 0.2s; }
        .music-widget.playing .music-bar:nth-child(1) { animation: bounce 1s infinite alternate; }
        .music-widget.playing .music-bar:nth-child(2) { animation: bounce 1s infinite 0.3s alternate; }
        .music-widget.playing .music-bar:nth-child(3) { animation: bounce 1s infinite 0.6s alternate; }
        
        @keyframes bounce { 0% { height: 6px; } 100% { height: 18px; background: var(--primary); } }

    </style>
</head>
<body onclick="initAudio()"> <!-- Klik dimanapun pertama kali buat trigger lagu -->

    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Background Music Audio Tag -->
    <!-- Pastikan ada file 'lagu.mp3' di repository/folder lu -->
    <audio id="bgMusic" src="lagu.mp3" loop></audio>

    <!-- Floating Music Widget -->
    <div class="music-widget" id="musicBtn" onclick="toggleMusic(event)">
        <div class="music-bar"></div>
        <div class="music-bar"></div>
        <div class="music-bar"></div>
    </div>

    <!-- Main App Container -->
    <div class="glass-panel">
        
        <div class="header">
            <div class="clock" id="clock">--:--:-- WIB</div>
            <h1 class="title">AM ELITE</h1>
            <p class="subtitle">Secure Processor Interface</p>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('proc')">Processor</button>
            <button class="tab-btn" onclick="switchTab('music')">Music Hub</button>
        </div>

        <!-- PROCESSOR TAB -->
        <div id="proc-tab">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email Terdaftar Alight Motion..." autocomplete="off">
            </div>
            <button class="btn-glow" onclick="sendEmail()" style="margin-bottom: 25px;">Request Access Link</button>

            <div class="input-group">
                <input type="text" id="magicLink" placeholder="Paste Magic Link di sini..." autocomplete="off">
            </div>
            <button class="btn-glow" onclick="verifyAcc()">Initialize Premium</button>

            <!-- Live Feed -->
            <div class="feed-section">
                <div class="feed-header">
                    <span>Live Database Feed</span>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <span style="font-size:9px;">CONNECTED</span>
                        <div class="pulse-dot"></div>
                    </div>
                </div>
                <div class="feed-list" id="historyList">
                    <!-- Skeleton Loading State -->
                    <div style="text-align:center; padding:20px; color:#555; font-size:12px;">
                        Syncing with secure server...
                    </div>
                </div>
            </div>
        </div>

        <!-- MUSIC (MAINTENANCE) TAB -->
        <div id="music-tab" style="display:none;">
            <div class="maintenance-card">
                <div class="maintenance-icon">🎧✨</div>
                <div class="maintenance-title">System Enhancement</div>
                <div class="maintenance-desc">
                    Fitur Music Player sedang dalam tahap <b>upgrade arsitektur</b> untuk memberikan kualitas audio premium yang lebih stabil.<br><br>
                    <i>We will be back shortly.</i>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
