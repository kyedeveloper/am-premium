<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AM Premium Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        :root { --accent: #9d50bb; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { width: 100%; max-width: 400px; background: #0c0c0c; border: 1px solid #222; border-radius: 30px; padding: 30px; box-shadow: 0 0 40px rgba(157, 80, 187, 0.1); }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 10px; background: #1a1a1a; border: none; border-radius: 12px; color: #666; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: var(--accent); color: white; }
        h1 { font-size: 20px; margin-bottom: 5px; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #222; background: #111; color: #fff; margin-bottom: 15px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, #6e48aa, #9d50bb); color: white; margin-bottom: 10px; }
        .stats { display: flex; justify-content: space-around; margin: 20px 0; padding-top: 20px; border-top: 1px solid #1a1a1a; }
        .stat-n { font-weight: 800; display: block; }
        .song-item { padding: 10px; background: #111; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="clock" style="text-align:center; font-size: 11px; color:#666; margin-bottom: 10px;">--:--:--</div>
        <h1>AM Premium</h1>
        
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('processor')">Premium</button>
            <button class="tab-btn" onclick="switchTab('music')">Music</button>
        </div>

        <div id="processor-tab">
            <input type="email" id="email" placeholder="Email Akun AM">
            <button class="btn" onclick="sendEmail()">Kirim Verifikasi</button>
            <input type="text" id="magicLink" placeholder="Paste Magic Link">
            <button class="btn" onclick="verifyAcc()">Aktifkan Premium</button>
            <div class="stats">
                <div class="stat"><span class="stat-n" id="visitorCount">-</span><small>Visitor</small></div>
                <div class="stat"><span class="stat-n" id="generatedCount">-</span><small>Success</small></div>
            </div>
            <div id="historyList" style="font-size: 11px;">Loading feed...</div>
        </div>

        <div id="music-tab" style="display:none;">
            <input type="text" id="searchQuery" placeholder="Cari lagu...">
            <button class="btn" onclick="searchMusic()">Cari Lagu</button>
            <div id="songResults"></div>
            <audio id="audioPlayer" controls style="width:100%; margin-top:15px;"></audio>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>
</html>
