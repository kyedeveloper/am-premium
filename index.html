<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AM Premium Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        :root { --accent: #9d50bb; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 400px; background: rgba(20, 20, 25, 0.8); backdrop-filter: blur(20px); border: 1px solid #222; border-radius: 30px; padding: 30px; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border:none; background:#222; color:#fff; }
        .tab-btn.active { background:#9d50bb; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(135deg, #6e48aa, #9d50bb); color: white; margin-top: 10px; }
        input { width: 100%; padding: 15px; border-radius: 12px; background: #111; border: 1px solid #333; color: #fff; box-sizing: border-box; margin-bottom: 10px; }
        .history-item { padding: 10px; border-bottom: 1px solid #1a1a1a; font-size: 12px; color: #aaa; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="card">
        <div id="clock" style="text-align:center; color:#666; font-size:11px; margin-bottom:10px;">--:--:--</div>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button class="tab-btn active" onclick="switchTab('proc')">Premium</button>
            <button class="tab-btn" onclick="switchTab('music')">Music</button>
        </div>
        <div id="proc-tab">
            <input id="email" placeholder="Email Akun AM">
            <button class="btn" onclick="sendEmail()">Kirim Verifikasi</button>
            <input id="magicLink" placeholder="Paste Magic Link">
            <button class="btn" onclick="verifyAcc()">Aktifkan Premium</button>
            <div id="historyList" style="margin-top:20px;"></div>
        </div>
        <div id="music-tab" style="display:none;">
            <input id="q" placeholder="Cari Lagu...">
            <button class="btn" onclick="searchMusic()">Cari</button>
            <div id="results"></div>
            <audio id="audio" controls style="width:100%; margin-top:10px;"></audio>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Ganti script.js tanpa /public/ -->
    <script src="script.js"></script>
</body>
</html>
