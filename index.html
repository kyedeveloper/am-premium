<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Premium | VIP Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        :root { --accent: #9d50bb; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { width: 90%; max-width: 400px; background: #0c0c0c; border: 1px solid #222; border-radius: 30px; padding: 40px; box-shadow: 0 0 40px rgba(157, 80, 187, 0.15); }
        h1 { font-size: 24px; margin-bottom: 5px; color: #fff; }
        .sub { color: #666; font-size: 13px; margin-bottom: 30px; }
        
        .step-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .help-btn { background: #222; border: none; color: #9d50bb; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.3s; }
        .help-btn:hover { background: #333; }

        input { width: 100%; padding: 15px; border-radius: 14px; border: 1px solid #222; background: #111; color: #fff; margin-bottom: 20px; outline: none; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 14px; border: none; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: 0.3s; }
        .btn-main { background: linear-gradient(135deg, #6e48aa, #9d50bb); color: white; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(157, 80, 187, 0.4); }
        
        .stats { display: flex; gap: 20px; margin-top: 30px; padding-top: 20px; border-top: 1px solid #1a1a1a; }
        .stat { flex: 1; text-align: center; }
        .stat-n { font-weight: 800; color: #fff; display: block; }
        .stat-l { font-size: 10px; color: #555; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Tambahin di dalam .card (di atas judul) -->
<div id="clock" style="color:#666; font-size: 11px; margin-bottom: 10px;">--:--:--</div>

<!-- Tambahin di paling bawah .card (sebelum tutup div) -->
<div class="history-section">
    <div class="step-label" style="margin-top: 30px;"><span>Live Success Feed</span></div>
    <div id="historyList" style="font-size: 12px; color: #444;">Loading...</div>
</div>
        
        <h1>AM Premium</h1>
        <p class="sub">Pro account processor for Alight Motion.</p>

        <!-- Step 1 -->
        <div class="step-label">
            <span style="font-size: 12px; color:#9d50bb">Langkah 1</span>
            <button class="help-btn" onclick="showHelp(1)">?</button>
        </div>
        <input type="email" id="email" placeholder="Email Akun AM">
        <button class="btn btn-main" onclick="sendEmail()">Kirim Link Verifikasi</button>

        <!-- Step 2 -->
        <div class="step-label" style="margin-top: 10px;">
            <span style="font-size: 12px; color:#6e48aa">Langkah 2</span>
            <button class="help-btn" onclick="showHelp(2)">?</button>
        </div>
        <input type="text" id="magicLink" placeholder="Tempel Magic Link">
        <button class="btn btn-main" onclick="verifyAcc()">Aktifkan Premium</button>

        <div class="stats">
            <div class="stat"><span class="stat-n" id="visitorCount">1,204</span><span class="stat-l">Visitor</span></div>
            <div class="stat"><span class="stat-n" id="generatedCount">842</span><span class="stat-l">Success</span></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>
</html>
